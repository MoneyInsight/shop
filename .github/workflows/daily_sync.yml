name: 새 상품 찾기 (도매꾹 API, 매일)
on:
  schedule:
    - cron: "17 5 * * *"    # 한국 시간 오후 2시 17분 — 기존 상품 품절 점검(1시 17분)이 도매꾹 호출 한도를 먼저 쓰게 한 뒤
  workflow_dispatch:
    inputs:
      limit: { description: "점검할 기존 상품 수", default: "4000" }
      new_limit: { description: "새 상품 찾기 조회 수", default: "60000" }
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: discover, cancel-in-progress: false }  # 오후 품절 점검·온채널 갱신과 대기열이 겹치면 대기 중이던 이 작업이 취소돼서 따로
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install openpyxl
      - name: 도매매 상품 조회·배송비·품절·키워드 갱신
        run: |
          python3 tools/domeggook_sync.py
          python3 tools/stock_sync.py data/_domeme_stock_result.json
          rm -f data/_domeme_stock_result.json
        env:
          DOMEGGOOK_API_KEY: ${{ secrets.DOMEGGOOK_API_KEY }}
          LIMIT: ${{ github.event.inputs.limit || '0' }}
      - name: 새 상품 찾기 (도매매)
        run: python3 tools/domeggook_discover.py
        env:
          DOMEGGOOK_API_KEY: ${{ secrets.DOMEGGOOK_API_KEY }}
          NEW_LIMIT: ${{ github.event.inputs.new_limit || '60000' }}
          ADD_TARGET: "5000"   # 도매매는 반품이 많아 하루 5천 개까지만 (오너클랜 위주) — 랭킹순 상위 500개 안에서
          MAX_MIN: "270"
      - name: 빌드·손해 점검
        run: |
          python3 build.py
          python3 tools/site_check.py
      - name: 저장
        run: |
          git config user.name "ttaengjab-bot"; git config user.email "bot@users.noreply.github.com"
          mkdir -p warehouse; git add data warehouse
          git commit -m "새 상품 찾기 (도매꾹 API)" || { echo "변경 없음"; exit 0; }
          ok=0; for i in 1 2 3 4 5 6; do git pull --rebase --autostash -X theirs && git push && ok=1 && break; sleep 20; done
          [ "$ok" = 1 ] || { echo "새 상품 저장 실패"; exit 1; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - uses: actions/deploy-pages@v4
