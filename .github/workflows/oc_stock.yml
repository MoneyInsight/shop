name: 오너클랜 품절·가격 점검 (매일)
on:
  schedule:
    - cron: "37 2 * * *"   # 한국 시간 오전 11시 37분
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/oc_stock.yml", "tools/oc_stock.py"]
concurrency: { group: oc-stock, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install openpyxl
      - name: 서버 배포 기다리기 (코드가 바뀐 경우)
        if: github.event_name == 'push'
        run: sleep 240
      - name: 오너클랜 점검 (우리 서버 경유)
        run: |
          python3 tools/oc_stock.py
          python3 tools/stock_sync.py data/_oc_stock_result.json
          rm -f data/_oc_stock_result.json
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      - name: 저장
        run: |
          git config user.name "allchaeum-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/stock.json && git commit -m "오너클랜 품절·가격 점검 $(date -u +%F)" || exit 0
          ok=0; for i in 1 2 3 4 5; do git pull --rebase --autostash -X theirs && git push && ok=1 && break; sleep 15; done
          [ "$ok" = 1 ]
