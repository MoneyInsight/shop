name: 오너클랜 대량 수집 속도 시험 (한 번)
on:
  push:
    branches: [main]
    paths: [".github/workflows/oc_scan_test.yml", "tools/oc_scan_test.py"]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sleep 240   # 서버 배포 기다림
      - run: python3 tools/oc_scan_test.py
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      - run: |
          git config user.name "allchaeum-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/oc_scan_test.json && git commit -m "오너클랜 수집 속도 시험 결과" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -X theirs && git push && break; sleep 10; done
