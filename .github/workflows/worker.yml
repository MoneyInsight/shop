name: 서버(Cloudflare Workers) 배포
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      TOSS_SECRET_KEY: ${{ secrets.TOSS_SECRET_KEY }}
      NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
      DOMEGGOOK_API_KEY: ${{ secrets.DOMEGGOOK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 등록된 비밀값 점검 (값은 표시하지 않음)
        env:
          S1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          S2: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          S3: ${{ secrets.ADMIN_PASSWORD }}
          S4: ${{ secrets.CF_API_TOKEN }}
          S5: ${{ secrets.CF_ACCOUNT_ID }}
          S6: ${{ secrets.CLOUDFLARE_TOKEN }}
          S7: ${{ secrets.NAVER_CLIENT_ID }}
          S8: ${{ secrets.DOMEME_API_KEY }}
        run: |
          for p in "CLOUDFLARE_API_TOKEN:$S1" "CLOUDFLARE_ACCOUNT_ID:$S2" "ADMIN_PASSWORD:$S3" "CF_API_TOKEN:$S4" "CF_ACCOUNT_ID:$S5" "CLOUDFLARE_TOKEN:$S6" "NAVER_CLIENT_ID:$S7" "DOMEME_API_KEY:$S8"; do
            n="${p%%:*}"; v="${p#*:}"; [ -n "$v" ] && echo "있음: $n (${#v}자)" || echo "없음: $n"
          done
      - name: Cloudflare 키 확인
        id: chk
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare 키가 아직 없어 배포를 건너뜁니다."; echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - name: 저장소(KV) 준비
        if: steps.chk.outputs.skip != '1'
        working-directory: worker
        run: |
          set -e
          ID=$(npx -y wrangler@4 kv namespace list | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s.slice(s.indexOf("[")));const n=a.find(x=>x.title==="shop-api-SHOP"||x.title==="SHOP");console.log(n?n.id:"")})')
          if [ -z "$ID" ]; then
            npx -y wrangler@4 kv namespace create SHOP | tee /tmp/kv.txt
            ID=$(grep -oE '[0-9a-f]{32}' /tmp/kv.txt | head -1)
          fi
          echo "KV id: $ID"
          sed -i "s/^id = .*/id = \"$ID\"/" wrangler.toml
      - name: 서버 배포
        if: steps.chk.outputs.skip != '1'
        working-directory: worker
        run: |
          set -e
          npx -y wrangler@4 deploy | tee /tmp/deploy.txt
          echo "::notice title=서버 주소::$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.txt | head -1)"
      - name: 비밀값 등록
        if: steps.chk.outputs.skip != '1'
        working-directory: worker
        run: |
          [ -n "$ADMIN_PASSWORD" ] && printf '%s' "$ADMIN_PASSWORD" | npx -y wrangler@4 secret put ADMIN_PASSWORD
          printf '%s' "${TOSS_SECRET_KEY:-test_gsk_docs_OaPz8L5KdmQXkzRz3y47BMw6}" | npx -y wrangler@4 secret put TOSS_SECRET_KEY
          [ -n "$NOTIFY_WEBHOOK" ] && printf '%s' "$NOTIFY_WEBHOOK" | npx -y wrangler@4 secret put NOTIFY_WEBHOOK
          [ -n "$DOMEGGOOK_API_KEY" ] && printf '%s' "$DOMEGGOOK_API_KEY" | npx -y wrangler@4 secret put DOMEGGOOK_API_KEY  # 결제 직전 실시간 재고 확인
          true
