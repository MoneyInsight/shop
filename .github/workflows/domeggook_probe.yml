name: 도매꾹 API 연결 확인
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/domeggook_probe.py
        env:
          DOMEGGOOK_API_KEY: ${{ secrets.DOMEGGOOK_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: probe, path: probe/, retention-days: 3 }
