name: 온채널 품절·가격 반영 (매일)
on:
  schedule:
    - cron: "7 4 * * *"    # 한국 시간 오후 1시 7분 (12:47 브라우저 점검이 만든 엑셀을 가져옴)
    - cron: "37 5 * * *"   # 늦게 끝난 날을 위한 한 번 더 (2:37)
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: daily-sync, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 새 엑셀이 있는지 확인
        id: chk
        run: |
          curl -sSf https://shop-api.scream0506.workers.dev/onch/files -o f.json
          python3 - <<'P'
          import json, time, os, pathlib
          d = json.load(open("f.json")); last = pathlib.Path("data/onch_last.txt")
          at = d.get("at", 0); done = last.read_text().strip() if last.exists() else ""
          fresh = at and time.time() * 1000 - at < 6 * 3600e3 and str(at) != done
          OUT = {"office": ("온채널상품.csv", "", ""), "winter": ("온채널겨울상품.csv", "겨울용품", "PICK=핫팩,손난로,전기요,전기매트,전기장판,온수매트,히터,난로,난방,보온물주머니,수면양말,털슬리퍼,털실내화,무릎담요,귀마개,귀도리,넥워머,목도리,털모자,바라클라바,털장갑,스키장갑,방풍,단열,뽁뽁이,내복,발열,롱패딩,방한,패딩 MAX=22000"), "more": ("온채널추가상품.csv", "auto", "SKIP=핫팩,손난로,전기요,전기매트,전기장판,온수매트,히터,난로,난방,보온물주머니,수면양말,털슬리퍼,털실내화,무릎담요,귀마개,귀도리,넥워머,목도리,털모자,바라클라바,털장갑,스키장갑,방풍,단열,뽁뽁이,내복,발열,롱패딩,방한,패딩 EXCL=온채널상품.csv,온채널겨울상품.csv MAX=32000")}
          with open("jobs.sh", "w") as f:
              for g, v in (d.get("groups") or {}).items():
                  if g not in OUT: continue
                  if len(v["files"]) < v.get("expected", 0):
                      print(f"{g}: 엑셀 {len(v['files'])}/{v['expected']}개만 성공 → 이 그룹은 반영 안 함"); continue
                  f.write(f"OUT={OUT[g][0]} CAT={OUT[g][1]} {OUT[g][2]} NO_GIT=1 bash tools/onch_apply.sh {' '.join(v['files'])}\n")
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"go={'1' if fresh and os.path.getsize('jobs.sh') else ''}\nat={at}\n")
          print("새 엑셀:", fresh)
          P
      - if: steps.chk.outputs.go
        run: pip install openpyxl
      - if: steps.chk.outputs.go
        name: 내려받기·변환
        run: bash -e jobs.sh
      - if: steps.chk.outputs.go
        name: 빌드·손해 점검
        run: |
          python3 build.py
          python3 tools/site_check.py
      - if: steps.chk.outputs.go
        name: 저장
        run: |
          echo "${{ steps.chk.outputs.at }}" > data/onch_last.txt
          git config user.name "ttaengjab-bot"; git config user.email "bot@users.noreply.github.com"
          git add data && git commit -m "온채널 품절·가격 반영 (매일)" && git pull --rebase -X theirs && git push || echo "변경 없음"
      - if: steps.chk.outputs.go
        uses: actions/configure-pages@v5
      - if: steps.chk.outputs.go
        uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - if: steps.chk.outputs.go
        uses: actions/deploy-pages@v4
