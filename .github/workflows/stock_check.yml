name: 품절·가격 점검 (매일, 오래된 순 1만 개)
on:
  schedule:
    - cron: "17 4 * * *"    # 한국 시간 오후 1시 17분 (하루 1번, 오래 확인 안 한 상품부터 1만 개)
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: daily-sync, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install openpyxl
      - name: 도매매 전 상품 품절·가격·배송비 점검
        run: |
          python3 tools/domeggook_sync.py
          python3 tools/stock_sync.py data/_domeme_stock_result.json
          rm -f data/_domeme_stock_result.json
        env:
          DOMEGGOOK_API_KEY: ${{ secrets.DOMEGGOOK_API_KEY }}
          LIMIT: "10000"
      - name: 빌드·손해 점검
        run: |
          python3 build.py
          python3 tools/ship_audit.py | tee audit.txt
          if grep -q "8% 미만: [1-9]" audit.txt; then echo "손해 위험 상품 있음 - 배포 중단"; exit 1; fi
      - name: 저장
        run: |
          git config user.name "ttaengjab-bot"; git config user.email "bot@users.noreply.github.com"
          git add data && git commit -m "품절·가격 점검 (도매꾹 API)" && git pull --rebase -X theirs && git push || echo "변경 없음"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - uses: actions/deploy-pages@v4
