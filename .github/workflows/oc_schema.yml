name: 오너클랜 API 구조 확인 (한 번)
on:
  push:
    branches: [main]
    paths: [".github/workflows/oc_schema.yml", "tools/oc_schema.py"]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 tools/oc_schema.py
        env:
          OWNERCLAN_ID: ${{ secrets.OWNERCLAN_ID }}
          OWNERCLAN_PW: ${{ secrets.OWNERCLAN_PW }}
      - run: |
          git config user.name "allchaeum-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/oc_schema.json && git commit -m "오너클랜 API 구조 확인 결과" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -X theirs && git push && break; sleep 10; done
