name: 관리자 상품 수정 반영 (30분마다 확인)
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 수정 내역이 바뀌었으면 사이트 다시 배포
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          W=$(curl -fsS https://shop-api.scream0506.workers.dev/edits | python3 -c "import sys,json;print(json.load(sys.stdin).get('ver',0))" || echo err)
          S=$(curl -fsS "https://moneyinsight.github.io/shop/edits_ver.txt?t=$(date +%s)" || echo 0)
          echo "서버 $W / 사이트 $S"
          if [ "$W" != "err" ] && [ "$W" != "$S" ]; then gh workflow run deploy.yml -R "$GITHUB_REPOSITORY" --ref main && echo "다시 배포 시작"; else echo "바뀐 것 없음"; fi
