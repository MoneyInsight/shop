name: 쇼핑몰 빌드·배포
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl && python build.py
      - name: 배포 전 사이트 점검 (문제 있으면 배포 중단)
        run: python3 tools/site_check.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - run: sleep 15  # 업로드 직후 GitHub가 산출물을 못 찾는 경우가 있어 잠깐 기다림
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60  # 실패하면 1분 뒤 한 번 더
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
