name = "shop-api"
main = "worker.js"
compatibility_date = "2026-11-01"

# npx wrangler kv namespace create SHOP 실행 후 나온 id를 아래에 넣으세요
[[kv_namespaces]]
binding = "SHOP"
id = "여기에_KV_ID"

[vars]
GITHUB_REPO = "MoneyInsight/shop"
SITE_URL = "https://moneyinsight.github.io/shop"
MARGIN_RATE = "0.055"
MIN_MARGIN = "0"
FREE_SHIPPING_OVER = "0"

# 비밀값은 파일에 쓰지 말고 아래 명령으로 등록하세요
# npx wrangler secret put TOSS_SECRET_KEY   (테스트: test_gsk_docs_OaPz8L5KdmQXkzRz3y47BMw6)
# npx wrangler secret put ADMIN_PASSWORD
# npx wrangler secret put GITHUB_TOKEN      (이 저장소 Contents 읽기/쓰기 권한 토큰)
